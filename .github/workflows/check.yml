name: check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare arkade fixture
        run: |
          git clone https://github.com/alexellis/arkade /tmp/arkade-source
          git -C /tmp/arkade-source checkout --detach e5215097ce8d9340af060412663f7c7130c594dd
      - name: Build offline runtime
        run: docker build -t rigmark-quality-runtime:0.4 quality_suite
      - name: Build native agent runtime
        run: |
          docker build -f quality_suite/Dockerfile.agent -t rigmark-quality-agent:0.8 quality_suite
          docker run --rm rigmark-quality-agent:0.8 --version
          docker run --rm --entrypoint go rigmark-quality-agent:0.8 version
      - name: Verify controls and Python
        run: |
          python3 -m compileall -q quality_suite rigmark
          python3 -m unittest quality_suite.test_governor quality_suite.test_tools quality_suite.test_native_arkade -v
          ./rigmark quality selftest --arkade-root /tmp/arkade-source
      - name: Verify public receipt cards
        run: |
          for directory in examples/receipts/*; do
            test -f "$directory/cards.txt" || continue
            ./rigmark quality report --output "$directory" > /tmp/cards.txt
            diff -u "$directory/cards.txt" /tmp/cards.txt
          done
